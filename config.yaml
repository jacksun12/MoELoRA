runtime:
  device: "cuda:0"

model:
  base_model_path: "Qwen/Qwen2.5-0.5B"
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  top_k: 1
  alpha: 16
  dropout: 0.05

stage0:
  enable: true
  dataset_type: "style_transfer_jsonl"  # 风格迁移 JSONL 数据集 / style_transfer_jsonl dataset
  data_dir: "data/cds_cloud_pretrain"
  use_peft: true
  epochs: 1
  learning_rate: 0.0002
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  max_samples: 0
  reuse_existing: true
  adapter_output_dir: "outputs/stage0_cloud_adapter"
  merged_output_dir: "outputs/stage0_cloud_merged"
  eval_max_samples: 1000

data:
  dataset_type: "style_transfer_jsonl"  # 可选：movielens_1m | composite_device | style_transfer_jsonl / options: movielens_1m | composite_device | style_transfer_jsonl
  data_dir: "data/cds_private_device"
  max_seq_len: 512
  history_size: 10
  min_history: 3
  min_user_samples: 3
  neg_sample_size: 3
  seed: 42
  batch_size: 48
  feature_batch_size: 32
  rank_eval_batch_size: 4
  eval_batch_size: 4
  stage1_samples: 50000
  feature_cache_dir: "data/feature_cache"

clustering:
  feature_strategy: "sentence_mean"  # 特征策略：sentence_mean | last_token / feature strategy: sentence_mean | last_token
  k_min: 2
  k_max: 8
  random_state: 42
  visualization_method: "strict"  # 可视化方式：none | pca | tsne | umap | both | strict | all / visualization method: none | pca | tsne | umap | both | strict | all
  visualization_max_points: 3000
  visualization_use_all_stage1: true
  visualization_dir: "eval/figures"

rank_allocation:
  total_budget: 32
  min_rank: 1
  max_rank: 32
  svd_weight: 1.0

training:
  trainer_backend: "trl"  # 训练后端：trl | custom / trainer backend: trl | custom
  cluster_epochs: 2
  lora_lr: 0.0002
  gradient_accumulation_steps: 4
  trl_per_device_batch_size: 4
  trl_gradient_accumulation_steps: 4
  trl_bf16: true
  trl_fp16: false
  trl_gradient_checkpointing: false
  trl_dataloader_num_workers: 0
  use_scheduler: true
  warmup_ratio: 0.10
  grad_clip: 1.0
  curve_log_every: 20
  curve_dir: "eval/figures"
  curve_run_name: "moe_lora_run"

stage2:
  drift_sample_size: 1000
  high_overlap_threshold: 0.75
  mid_overlap_threshold: 0.50
  replay_enable: true
  replay_ratio: 0.5
  replay_strategy: "stratified"  # 回放策略：stratified | random / replay strategy: stratified | random
  replay_min_per_cluster: 0
  optimize_for: "time"  # 优化目标：time | performance / optimize for: time | performance

evaluation:
  enable: true
  compare_reference_models: true
  k: 1
  max_samples: 500
  max_new_tokens: 96

outputs:
  checkpoint_root: "/remote-home/share/sunyansong/aggLLMv3"
  trl_run_root: "eval/trl_runs"
